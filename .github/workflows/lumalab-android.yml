name: LumaLab Android

on:
  push:
    paths:
      - "apps/lumalab-android/**"
      - ".github/workflows/lumalab-android.yml"
  pull_request:
    paths:
      - "apps/lumalab-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/lumalab-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test image engine
        run: ./gradlew -p core test --no-daemon

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lumalab-apks
          path: apps/lumalab-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Collect APKs for download
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LumaLab-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/LumaLab-release.apk

      # Publishes a direct, phone-friendly download link (no GitHub login or zip needed).
      - name: Publish latest build as a pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumalab-latest
          name: LumaLab (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Latest LumaLab build from `${{ github.ref_name }}` (${{ github.sha }}).
            Install `LumaLab-debug.apk` on Android 10+ (allow installing from unknown sources).
          files: |
            apps/lumalab-android/dist/LumaLab-debug.apk
            apps/lumalab-android/dist/LumaLab-release.apk
          overwrite_files: true

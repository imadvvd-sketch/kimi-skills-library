name: LumaLab Android

on:
  push:
    paths:
      - "apps/lumalab-android/**"
      - ".github/workflows/lumalab-android.yml"
  pull_request:
    paths:
      - "apps/lumalab-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lumalab-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test image engine
        run: ./gradlew -p core test --no-daemon

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lumalab-apks
          path: apps/lumalab-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
